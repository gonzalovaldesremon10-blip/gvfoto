<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galería | GV Foto</title>
  <meta name="description" content="Galería de fotografía de GV Foto. Automovilismo, caballos, urbanos y más.">

  <link rel="canonical" href="https://gvfoto.com/gallery.html">

  <!-- Open Graph (para Google y redes) -->
  <meta property="og:title" content="Galería | GV Foto">
  <meta property="og:description" content="Descubre la galería de fotografía de GV Foto.">
  <meta property="og:image" content="https://gvfoto.com/FOTOS/LOGO/Sin%20t%C3%ADtulo-1.png">
  <meta property="og:url" content="https://gvfoto.com/gallery.html">

  <!-- Favicon -->
  <link rel="icon" href="/FOTOS/LOGO/Sin título-1.png">
  <link rel="shortcut icon" href="/FOTOS/LOGO/Sin título-1.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/styles.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <div class="logo">
      <a href="/" aria-label="Volver a inicio">
        <img src="/FOTOS/LOGO/Sin título-1.png" alt="Logo GV Foto">
      </a>
    </div>

    <nav aria-label="Navegación principal">
      <a href="/gallery.html">GALERIA</a>
      <a href="/contact.html">CONTACTO</a>
    </nav>
  </header>

  <main>
    <section class="galleryPage galleryPageOlympic" aria-label="Categorías de galería">
      <div class="polaroidGrid olympicGrid">

        <a href="automovilismo.html" class="polaroid olympicCard card-1" aria-label="Ir a Automovilismo">
          <picture><source srcset="FOTOS/AUTOMOVILISMO/foto 1-medium.webp" type="image/webp"><img src="FOTOS/AUTOMOVILISMO/foto 1-medium.webp" alt="Automovilismo" loading="lazy" decoding="async"></picture>
          <p>AUTOMOVILISMO</p>
        </a>

        <a href="caballos.html" class="polaroid olympicCard card-2" aria-label="Ir a Caballos">
          <picture><source srcset="FOTOS/CABALLOS/caballo 3-medium.webp" type="image/webp"><img src="FOTOS/CABALLOS/caballo 3-medium.webp" alt="Caballos" loading="lazy" decoding="async"></picture>
          <p>CABALLOS</p>
        </a>

        <a href="clasicos.html" class="polaroid olympicCard card-3" aria-label="Ir a Clásicos">
          <picture><source srcset="FOTOS/CLASICOS/clasicos64-medium.webp" type="image/webp"><img src="FOTOS/CLASICOS/clasicos64-medium.webp" alt="Clásicos" loading="lazy" decoding="async"></picture>
          <p>CLASICOS</p>
        </a>

        <a href="deportivos.html" class="polaroid olympicCard card-4" aria-label="Ir a Deportivos">
          <picture><source srcset="FOTOS/DEPORTIVOS/deportivos1-medium.webp" type="image/webp"><img src="FOTOS/DEPORTIVOS/deportivos1-medium.webp" alt="Deportivos" loading="lazy" decoding="async"></picture>
          <p>DEPORTIVOS</p>
        </a>

        <a href="motociclismo.html" class="polaroid olympicCard card-5" aria-label="Ir a Motociclismo">
          <picture><source srcset="FOTOS/MOTOCICLISMO/moto 18-medium.webp" type="image/webp"><img src="FOTOS/MOTOCICLISMO/moto 18-medium.webp" alt="Motociclismo" loading="lazy" decoding="async"></picture>
          <p>MOTOCICLISMO</p>
        </a>

        <a href="toros.html" class="polaroid olympicCard card-6" aria-label="Ir a Toros">
          <picture><source srcset="FOTOS/TOROS/toro 14-medium.webp" type="image/webp"><img src="FOTOS/TOROS/toro 14-medium.webp" alt="Toros" loading="lazy" decoding="async"></picture>
          <p>TOROS</p>
        </a>

        <a href="urbana.html" class="polaroid olympicCard card-7" aria-label="Ir a Urbana">
          <picture><source srcset="FOTOS/URBANA/urbana15-medium.webp" type="image/webp"><img src="FOTOS/URBANA/urbana15-medium.webp" alt="Urbana" loading="lazy" decoding="async"></picture>
          <p>URBANA</p>
        </a>

      </div>
    </section>
  </main>

  <audio id="clickSound" src="click.mp3"></audio>

  <script>
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        const sound = document.getElementById("clickSound");
        if (sound) {
          sound.currentTime = 0;
          sound.play().catch(() => {});
        }
      });
    });
  </script>

</body>
</html>
