<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contacto | GV Foto</title>
  <meta name="description" content="Contacto de GV Foto. Escríbeme para sesiones, colaboraciones, eventos o cualquier consulta relacionada con fotografía.">

  <link rel="canonical" href="https://gvfoto.com/contact.html">

  <meta property="og:title" content="Contacto | GV Foto">
  <meta property="og:description" content="Página de contacto de GV Foto.">
  <meta property="og:image" content="https://gvfoto.com/FOTOS/LOGO/Sin%20t%C3%ADtulo-1.png">
  <meta property="og:url" content="https://gvfoto.com/contact.html">

  <link rel="icon" type="image/png" href="/FOTOS/LOGO/favicon.png">
  <link rel="shortcut icon" href="/FOTOS/LOGO/favicon.png">
  <link rel="apple-touch-icon" href="/FOTOS/LOGO/favicon.png">

  <link rel="stylesheet" href="/styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body class="contact-page">

  <header>
    <div class="logo">
      <a href="/" aria-label="Volver a inicio">
        <img src="/FOTOS/LOGO/Sin título-1.png" alt="Logo GV Foto">
      </a>
    </div>

    <nav aria-label="Navegación principal">
      <a href="/gallery.html">GALERIA</a>
      <a href="/contact.html">CONTACTO</a>
    </nav>
  </header>

  <main class="contact-split">

    <!-- Columna izquierda: foto -->
    <div class="contact-image">
      <picture>
        <source media="(min-width: 1200px)" srcset="/FOTOS/URBANA/20230724130911__MG_0033-large.webp" type="image/webp">
        <source media="(min-width: 600px)" srcset="/FOTOS/URBANA/20230724130911__MG_0033-medium.webp" type="image/webp">
        <img src="/FOTOS/URBANA/20230724130911__MG_0033-small.webp" alt="" loading="eager" decoding="async">
      </picture>
      <span class="photo-signature" aria-hidden="true">gv.</span>
    </div>

    <!-- Columna derecha: contenido -->
    <div class="contact-content">

      <p class="contact-eyebrow"><span class="eyebrow-line"></span>PONTE EN CONTACTO</p>

      <h1 class="contact-title">Hablemos<span class="dot">.</span></h1>

      <p class="contact-intro">
        Encargos, sesiones y colaboraciones.<br>
        Cuéntame tu idea y la ponemos en imagen.
      </p>

      <div class="contact-list">

        <a href="mailto:gvfoto850@gmail.com" class="contact-row" aria-label="Enviar email">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-10 5L2 7"></path>
            </svg>
          </span>
          <div class="contact-text">
            <span class="contact-label">EMAIL</span>
            <span class="contact-value">gvfoto850@gmail.com</span>
          </div>
          <span class="contact-arrow" aria-hidden="true">→</span>
        </a>

        <a href="https://www.instagram.com/gv_foto_/" target="_blank" rel="noopener noreferrer" class="contact-row" aria-label="Abrir Instagram">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle>
            </svg>
          </span>
          <div class="contact-text">
            <span class="contact-label">INSTAGRAM</span>
            <span class="contact-value">@gv_foto_</span>
          </div>
          <span class="contact-arrow" aria-hidden="true">→</span>
        </a>

        <a href="tel:+34605413204" class="contact-row" aria-label="Llamar por teléfono">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </span>
          <div class="contact-text">
            <span class="contact-label">TELÉFONO</span>
            <span class="contact-value">605 41 32 04</span>
          </div>
          <span class="contact-arrow" aria-hidden="true">→</span>
        </a>

      </div>

    </div>

  </main>

  <audio id="clickSound" src="/click.mp3" preload="none"></audio>

  <script>
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        const sound = document.getElementById("clickSound");
        if (sound) {
          sound.currentTime = 0;
          sound.play().catch(() => {});
        }
      });
    });
  </script>

</body>
</html>
