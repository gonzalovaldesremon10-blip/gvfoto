  <audio id="clickSound" src="/click.mp3" preload="none"></audio>

  <script>
    (function(){
      const slides = document.querySelectorAll(".slide");
      let currentSlide = 0;
      let interval = null;
      const SLIDE_MS = 5000;

      // Carga perezosa progresiva: precargamos la siguiente slide antes de que toque
      function preload(index){
        const img = slides[index];
        if (!img) return;
        const real = img.getAttribute("data-src");
        if (real && !img.src){
          img.src = real;
        }
      }

      // Precargamos la 2ª slide en cuanto cargue la 1ª (ya en src)
      // y vamos precargando la siguiente en cada cambio.
      function nextSlide(){
        if (slides.length === 0) return;
        const next = (currentSlide + 1) % slides.length;
        preload(next); // por si acaso
        slides[currentSlide].classList.remove("active");
        slides[next].classList.add("active");
        currentSlide = next;
        // pre-cargamos la SIGUIENTE para que no se note el cambio
        preload((next + 1) % slides.length);
      }

      function startCarousel(){
        if (slides.length === 0) return;
        clearInterval(interval);
        interval = setInterval(nextSlide, SLIDE_MS);
      }

      // Arrancamos cuando la 1ª foto está lista
      const first = slides[0];
      if (first && first.complete){
        preload(1);
        startCarousel();
      } else if (first){
        first.addEventListener("load", () => {
          preload(1);
          startCarousel();
        }, { once: true });
        // fallback por si no dispara load
        setTimeout(() => { preload(1); startCarousel(); }, 2500);
      }

      // Pausar cuando la pestaña no es visible (ahorra batería + datos)
      document.addEventListener("visibilitychange", () => {
        if (document.hidden){
          clearInterval(interval);
        } else {
          startCarousel();
        }
      });

      // Click sound (no bloqueamos navegación)
      document.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => {
          const sound = document.getElementById("clickSound");
          if (sound){
            sound.currentTime = 0;
            sound.play().catch(() => {});
          }
        });
      });
    })();
  </script>
